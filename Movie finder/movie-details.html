
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Details | Movie Hub</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>


<body class="min-h-screen bg-slate-950 text-white">


    <!-- Header -->
    <header class="sticky top-0 z-50 border-b border-white/10 bg-slate-950/85 backdrop-blur-md">

        <div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 sm:px-6">

            <a
                href="index.html"
                class="text-2xl font-bold tracking-wide transition hover:opacity-90"
            >
                🎬 <span class="text-red-500">Movie</span> Hub
            </a>


            <a
                href="index.html"
                class="group flex items-center gap-2 rounded-xl border border-white/10 bg-slate-900 px-4 py-2 text-sm font-medium text-slate-300 transition duration-200 hover:border-red-500/40 hover:bg-red-500/10 hover:text-white"
            >
                <span class="transition group-hover:-translate-x-1">
                    ←
                </span>

                Back
            </a>

        </div>

    </header>


    <!-- Movie Details -->
    <main class="mx-auto max-w-6xl px-5 py-10 sm:px-6 sm:py-14">


        <!-- Details Container -->
        <div
            id="movie-detail"
            class="overflow-hidden rounded-3xl border border-white/10 bg-slate-900 shadow-2xl shadow-black/30"
        >

            <!-- Movie details will come here -->

        </div>


    </main>


    <!-- Footer -->
    <footer class="border-t border-white/10 py-6 text-center text-sm text-slate-500">

        © 2026 Movie Hub • Powered by OMDb API

    </footer>


    <script src="movie-details.js"></script>

</body>

</html>
