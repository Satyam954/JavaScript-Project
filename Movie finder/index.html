<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Hub</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white">

    <!-- Header -->
    <header class="sticky top-0 z-50 border-b border-white/10 bg-slate-950/85 backdrop-blur-md">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 sm:px-6">

            <h1 class="text-2xl flex gap-4  font-bold tracking-wide">
               <svg class="h-10 w-10" xmlns="http://www.w3.org/2000/svg" height="14" width="14" viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path fill="rgb(247, 247, 247)" d="M512 128C514 128 515.9 128.1 517.8 128.3L422.1 224L490 224L562 152C570.8 163 576 176.9 576 192L576 448C576 483.3 547.3 512 512 512L128 512C92.7 512 64 483.3 64 448L64 192C64 156.7 92.7 128 128 128L198.1 128L102.1 224L170 224L265 129L266 128L358.1 128L262.1 224L330 224L425 129L426 128L512.1 128z"/></svg><span class="text-red-500">Movie</span> Hub
            </h1>

            <span class="hidden text-sm text-slate-400 sm:block">
                 Find your next movie 
            </span>

        </div>
    </header>


    <!-- Main -->
    <main class="mx-auto max-w-7xl px-5 py-12 sm:px-6">

        <!-- Hero / Search -->
        <section class="mx-auto mb-14 max-w-3xl text-center">

            <div class="mb-4 inline-flex items-center gap-2 rounded-full border border-red-500/20 bg-red-500/10 px-4 py-2 text-sm text-red-400">
                
<svg class="w-6 h-6 text-green-900" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
  <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
</svg>
 Movie Search
            </div>

            <h2 class="mb-4 text-4xl font-extrabold leading-tight sm:text-5xl md:text-6xl">
                Find Your
                <span class="text-red-500">Favorite Movies</span>
            </h2>

            <p class="mx-auto mb-8 max-w-xl text-slate-400">
                Search thousands of movies and discover posters, release years
                and more.
            </p>


            <!-- Search Form -->
            <form
                id="movieform"
                class="mx-auto flex max-w-2xl overflow-hidden rounded-2xl border border-white/10 bg-slate-900/80 shadow-2xl shadow-black/30 transition focus-within:border-red-500/50 focus-within:ring-4 focus-within:ring-red-500/10"
            >

                <input
                    type="text"
                    id="movieinput"
                    placeholder="Search movie... e.g. Batman"
                    autocomplete="off"
                    class="min-w-0 flex-1 bg-transparent px-5 py-4 text-white outline-none placeholder:text-slate-500"
                >

                <button
                    type="submit"
                    class="bg-red-600 px-6 py-4 font-semibold transition duration-200 hover:bg-red-500 active:scale-95 sm:px-8"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
  <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
</svg>

                </button>

            </form>

        </section>


        <!-- Movies -->
        <section>

            <div
                id="moviehub"
                class="grid grid-cols-2 gap-5 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6"
            >
                <!-- Movies will come here -->
            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="mt-10 border-t border-white/10 py-6 text-center text-sm text-slate-500">
        © 2026 Movie Hub • Powered by OMDb API
    </footer>


    <script src="index.js"></script>

</body>
</html>
