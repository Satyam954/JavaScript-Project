<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="input.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="bg-green-500 w-full  flex justify-center  ">


    <div class=" mt-50  border p-5 rounded-2xl bg-black ">
        <div class="text-2xl flex gap-3 justify-between items-center text-cyan-400  font-black mb-5">
            <h1>Tic Tac Toe game</h1>
            <button id="reset" class="  bg-red-600 text-lg text-amber-50 mt-2 px-2 py-1 border rounded-sm border-cyan-400">Reset</button>
            
        </div>

        <div id="boards" class="  flex  flex-col gap-2">
            <div id="board-1" class="flex justify-center  gap-5">
              <div class="box flex justify-center items-center font-black text-3xl h-20 w-20 bg-white border rounded-xl"></div>
              <div class="box flex justify-center items-center font-black text-3xl h-20 w-20 bg-white border rounded-xl"></div>
              <div class="box flex justify-center items-center font-black text-3xl h-20 w-20 bg-white border rounded-xl"></div>
            </div>

            <div id="board-2" class="flex justify-center   gap-5">
                <div class="box flex justify-center items-center font-black text-3xl h-20 w-20 bg-white border rounded-xl"></div>
                <div class="box flex justify-center items-center font-black text-3xl h-20 w-20 bg-white border rounded-xl"></div>
                <div class="box flex justify-center items-center font-black text-3xl h-20 w-20 bg-white border rounded-xl"></div>
          
            </div>
            <div id="board-3" class="flex justify-center   gap-5">
               <div class="box flex justify-center items-center font-black text-3xl h-20 w-20 bg-white border rounded-xl"></div>
               <div class="box flex justify-center items-center font-black text-3xl h-20 w-20 bg-white border rounded-xl"></div>
               <div class="box flex justify-center items-center font-black text-3xl h-20 w-20 bg-white border rounded-xl"></div>

            </div>

        </div>
        <div id="winner" class="flex hidden justify-center gap-5 items-center">
            <h2 id="winnername"  class="text-amber-400 font-bold text-2xl">winner</h2>
        <button id="restart" class="bg-red-600 text-l text-amber-50 mt-2 px-2 py-1 border rounded-sm border-cyan-400" >Play again</button>
        </div>
        
    </div>

    <script src="index.js"></script>
</body>

</html>
