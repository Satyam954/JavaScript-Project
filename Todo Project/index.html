<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo</title>
    <link rel="stylesheet" href="input.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="bg-slate-100">
    <div class=" max max-w-md mx-auto  bg-white rounded-lg p-2">
        <div class="bg-indigo-500 p-5 font-bold text-white">
            <h1>Todo app</h1>
        </div>
        <div class="p-5">
            <form action="" id="todo-form" class="flex gap-5">
              <div class="flex gap-5 mb-1">
                    <input id="todo-input" placeholder="Enter task description..."
                        class="flex-1 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800"
                        type="text">
                    <button id="form-btn"
                        class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-colors cursor-pointer">Add</button>
                </div>
                <button type="button" id="cancel-btn"
                    class="hidden self-end text-xs text-slate-500 hover:text-slate-700 underline cursor-pointer">
                    Cancel Editing
                </button>
            </form>

            <div class="flex justify-between text-sm pt-5 pb-1  border-b border-black">
                <p id="task-count">Tasks (1)</p>
                <p id="task-complete">Completed:1</p>
            </div>

            <ul class="py-5 flex flex-col gap-2" id="todo-list">
               <!-- <li data-id="1" class="flex gap-2 border border-slate-300 p-4  rounded-xl ">
                <input data-id="1" type="checkbox">
                <p class="flex-1">Go to gym</p>
                <div class="flex gap-2">
                    <button data-id="1">Edit</button>
                    <button data-id="1">Delete</button>
                </div>
               </li> -->
            </ul>

               <div id="empty-state" class="hidden text-center py-8 text-slate-400">
                <p class="text-sm">No tasks found. Add a task above to get started!</p>
            </div>
        </div>
    </div>



    <script src="index.js"></script>
</body>

</html>
